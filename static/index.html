<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chatbot</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7280;
      --user: #2563eb; --user-text: #ffffff; --bot: #eef1f5; --border: #e3e6ec; --error: #b42318; --error-bg: #fdecea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b; --panel: #1a1e26; --text: #e6e8ec; --muted: #9aa1ad;
        --user: #3b82f6; --user-text: #ffffff; --bot: #252a34; --border: #2c323d; --error: #ff8a80; --error-bg: #3a1f1f;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .app { max-width: 760px; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column;
           background: var(--panel); border-inline: 1px solid var(--border); }
    header { display: flex; align-items: center; justify-content: space-between;
             padding: 14px 16px; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    button { font: inherit; cursor: pointer; border-radius: 8px; }
    #reset { background: none; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; }
    #reset:hover { background: var(--bot); }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .empty { margin: auto; color: var(--muted); text-align: center; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .msg.error { align-self: flex-start; background: var(--error-bg); color: var(--error); }
    .msg.typing::after { content: "▍"; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
    textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg);
               border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; max-height: 160px; }
    textarea:focus { outline: 2px solid var(--user); outline-offset: -1px; }
    #send { background: var(--user); color: var(--user-text); border: none; padding: 0 18px; }
    #send:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>AI Chatbot</h1>
      <button id="reset" type="button">New conversation</button>
    </header>
    <div id="messages"><p class="empty">Ask me anything to start the conversation.</p></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Type a message…" title="Enter to send, Shift+Enter for a new line" maxlength="4000"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const resetBtn = document.getElementById("reset");

    let sessionId = crypto.randomUUID();
    let busy = false;

    function addMessage(role, text = "") {
      messagesEl.querySelector(".empty")?.remove();
      const el = document.createElement("div");
      el.className = `msg ${role}`;
      el.textContent = text;  // textContent, never innerHTML: model output is not trusted HTML
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    function setBusy(value) {
      busy = value;
      sendBtn.disabled = value;
      resetBtn.disabled = value;
    }

    async function sendMessage(text) {
      setBusy(true);
      addMessage("user", text);
      const bubble = addMessage("assistant");
      bubble.classList.add("typing");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: text }),
        });
        if (!response.ok) throw new Error(`Server returned ${response.status}`);

        // Read the Server-Sent Events stream chunk by chunk.
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let finished = false;

        while (!finished) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const events = buffer.split("\n\n");
          buffer = events.pop();  // keep any incomplete event for the next chunk

          for (const raw of events) {
            if (!raw.startsWith("data: ")) continue;
            const event = JSON.parse(raw.slice(6));
            if (event.type === "token") {
              bubble.textContent += event.text;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            } else if (event.type === "error") {
              bubble.remove();
              addMessage("error", event.message);
              finished = true;
            } else if (event.type === "done") {
              finished = true;
            }
          }
        }
      } catch (err) {
        console.error(err);
        bubble.remove();
        addMessage("error", "Connection problem. Check that the server is running and try again.");
      } finally {
        bubble.classList.remove("typing");
        setBusy(false);
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || busy) return;
      input.value = "";
      input.style.height = "auto";
      sendMessage(text);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = `${input.scrollHeight}px`;
    });

    resetBtn.addEventListener("click", async () => {
      if (busy) return;
      await fetch("/api/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId }),
      }).catch(() => {});
      sessionId = crypto.randomUUID();
      messagesEl.innerHTML = '<p class="empty">New conversation started. Ask me anything.</p>';
      input.focus();
    });
  </script>
</body>
</html>
